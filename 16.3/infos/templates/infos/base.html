<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Portfolio{% endblock %}</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #222;
        }
        header {
            background: #2c3e50;
            padding: 1rem 2rem;
        }
        nav a {
            color: #ecf0f1;
            text-decoration: none;
            margin-right: 1.5rem;
            font-weight: bold;
        }
        nav a.active {
            color: #e67e22;
            border-bottom: 2px solid #e67e22;
        }
        main {
            max-width: 700px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        footer {
            text-align: center;
            padding: 1rem;
            color: #777;
            font-size: 0.9rem;
        }
        img.avatar {
            max-width: 200px;
            border-radius: 50%;
            display: block;
            margin: 1rem auto;
        }
        form label {
            display: block;
            margin-top: 1rem;
        }
        form input, form textarea {
            width: 100%;
            padding: 0.5rem;
            box-sizing: border-box;
        }
        form button {
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
        }
    </style>
</head>
<body>
<header>
    <nav>
        <a href="{% url 'home' %}" class="{% if active == 'home' %}active{% endif %}">Home</a>
        <a href="{% url 'me' %}" class="{% if active == 'me' %}active{% endif %}">Me</a>
        <a href="{% url 'contact' %}" class="{% if active == 'contact' %}active{% endif %}">Contact</a>
    </nav>
</header>
<main>
    {% block content %}{% endblock %}
</main>
<footer>
    &copy; 2026 Artur Machura's portfolio
</footer>
</body>
</html>
